<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WinWhisperServer - Speech to Text</title>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/lib/material-icons/material-icons.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/index.css">
  <script type="module" src="/index.js"></script>
</head>

<body>
  <main class="container">
    <header class="page-header">
      <div>
        <h1>WinWhisperServer</h1>
        <p>Speech-to-text transcription powered by Faster Whisper XXL</p>
      </div>
      <a class="header-link" href="/analytics/">
        <span class="material-icons" aria-hidden="true">insights</span><span class="header-link-text">Usage Statistics</span>
      </a>
    </header>

    <div class="file-select-area" id="fileSelectArea">
      <p>Drag & drop an audio file here, or click to select one.</p>
      <input type="file" name="fileInput" id="fileInput" aria-label="Audio file" accept=".wav,.mp3,.m4a,.aac,.flac,.ogg,.opus,.wma,.aif,.aiff,.mp4">
      <button class="btn" id="browseBtn">Select Audio File</button>
    </div>

    <div id="fileName" aria-live="polite"></div>

    <button class="btn" id="transcribeBtn" disabled>
      Upload & Transcribe
      <span class="spinner" aria-hidden="true"></span>
    </button>

    <div id="result" aria-live="polite"></div>
  </main>
</body>
