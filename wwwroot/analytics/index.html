<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WinWhisperServer - Usage Statistics</title>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/lib/material-icons/material-icons.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/analytics/index.css">
  <script type="module" src="/analytics/index.js"></script>
</head>

<body>
  <main class="container">
    <header class="page-header">
      <div>
        <h1>Usage Statistics</h1>
        <p class="muted" id="trackingInfo">Loading…</p>
      </div>
      <a class="header-link" href="/">
        <span class="material-icons" aria-hidden="true">arrow_back</span><span class="header-link-text">Transcription</span>
      </a>
    </header>

    <div class="toolbar">
      <div class="segmented" id="windowSelector" role="group" aria-label="Time window">
        <button type="button" data-days="7">7 days</button>
        <button type="button" data-days="30">30 days</button>
        <button type="button" data-days="90">90 days</button>
      </div>
      <button type="button" class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh">
        <span class="material-icons" aria-hidden="true">refresh</span>
      </button>
      <span class="muted" id="updatedAt"></span>
      <button type="button" class="icon-btn labeled" id="csvBtn" title="Download as CSV" disabled>
        <span class="material-icons" aria-hidden="true">download</span> CSV
      </button>
    </div>

    <div id="result" aria-live="polite"></div>

    <div id="content" hidden>
      <p class="current-state" id="currentState"></p>

      <section>
        <h2 id="windowTitle"></h2>
        <div class="cards" id="cards"></div>
        <p class="hint" id="audioHint" hidden>
          <span class="material-icons" aria-hidden="true">info</span>
          Recording lengths are only measured when <code>NormalizeAudio</code> is enabled.
        </p>
      </section>

      <section>
        <div class="section-header">
          <h2>Per Day</h2>
          <div class="segmented small" id="metricSelector" role="group" aria-label="Chart metric">
            <button type="button" data-metric="jobs">Transcriptions</button>
            <button type="button" data-metric="audio">Audio</button>
          </div>
        </div>
        <div class="chart">
          <span class="chart-max" id="chartMax"></span>
          <div class="chart-bars" id="chartBars"></div>
        </div>
        <div class="day-detail" id="dayDetail">
          <span class="material-icons" aria-hidden="true">event</span>
          <span id="dayDetailText"></span>
          <span class="day-detail-hint">Select a bar to see another day</span>
        </div>
      </section>

      <section>
        <h2>Details</h2>
        <div class="table-wrap">
          <table class="details-table">
            <thead id="detailsHead"></thead>
            <tbody id="detailsBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
